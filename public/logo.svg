<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Stylized "ON" logo with shutter design -->
  <defs>
    <clipPath id="oClip">
      <circle cx="85" cy="85" r="70"/>
    </clipPath>
  </defs>

  <!-- O letter -->
  <circle cx="85" cy="85" r="70" fill="#1a1a1a"/>
  <circle cx="85" cy="85" r="40" fill="white"/>

  <!-- Shutter blades inside O -->
  <g clip-path="url(#oClip)">
    <g transform="translate(85,85)">
      <!-- Blade 1 -->
      <path d="M0,-15 L25,-40 L10,-40 L-15,-15Z" fill="#1a1a1a" transform="rotate(0)" opacity="0.85"/>
      <!-- Blade 2 -->
      <path d="M0,-15 L25,-40 L10,-40 L-15,-15Z" fill="#1a1a1a" transform="rotate(60)" opacity="0.85"/>
      <!-- Blade 3 -->
      <path d="M0,-15 L25,-40 L10,-40 L-15,-15Z" fill="#1a1a1a" transform="rotate(120)" opacity="0.85"/>
      <!-- Blade 4 -->
      <path d="M0,-15 L25,-40 L10,-40 L-15,-15Z" fill="#1a1a1a" transform="rotate(180)" opacity="0.85"/>
      <!-- Blade 5 -->
      <path d="M0,-15 L25,-40 L10,-40 L-15,-15Z" fill="#1a1a1a" transform="rotate(240)" opacity="0.85"/>
      <!-- Blade 6 -->
      <path d="M0,-15 L25,-40 L10,-40 L-15,-15Z" fill="#1a1a1a" transform="rotate(300)" opacity="0.85"/>
    </g>
    <!-- Center triangle -->
    <polygon points="85,65 75,82 95,82" fill="white" opacity="0.9"/>
  </g>

  <!-- N letter - stylized arc -->
  <path d="M180,145 C180,45 280,25 280,85 L280,145"
        fill="none" stroke="#1a1a1a" stroke-width="35" stroke-linecap="round"/>

  <!-- SWITCHING ON text -->
  <text x="200" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#1a1a1a" letter-spacing="6">SWITCHING ON</text>
</svg>
